[package]
name = "grammaria"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A French grammar and spelling checker in Rust: LanguageTool's French rules reproduced match for match, plus its own"
# One license for the whole crate: LanguageTool's, whose French checker it
# ports. THIRD_PARTY_LICENSES.md keeps the notices of the projects it builds on.
license = "LGPL-2.1-or-later"
repository = "https://github.com/WillIsback/grammaria-rc"
readme = "README.md"
keywords = ["grammar", "french", "spellcheck", "nlp", "languagetool"]
categories = ["text-processing", "command-line-utilities"]
# What crates.io receives: the engine and its data. The benchmark material,
# the development tools and the tests (which read the benchmark) stay in the
# repository.
exclude = ["/eval", "/tools", "/tests", "/.github"]

[[bin]]
name = "grammaria"
path = "src/main.rs"

[lib]
name = "grammaria"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"

[dependencies]
