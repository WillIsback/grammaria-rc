name: Publish to crates.io

# Publishes the crate when a version tag is pushed (v0.1.0 publishes version
# 0.1.0 of Cargo.toml). A manual run only rehearses the publication unless
# "publish" is ticked. A published version can never be replaced: the job
# tests the crate first and refuses a tag that does not match Cargo.toml.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Really publish (otherwise: dry run)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Check that the tag matches Cargo.toml
        if: github.event_name == 'push'
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - name: Test
        run: cargo test --release --locked

      # Builds the crate exactly as crates.io will serve it.
      - name: Dry run
        run: cargo publish --dry-run --locked

      - name: Publish
        if: github.event_name == 'push' || inputs.publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
